<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>회천청소년문화의집 번개 미션</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; }
        #card { background: #fff; width: 100%; max-width: 420px; height: 100vh; max-height: 840px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; position: relative; border-radius: 16px; overflow: hidden; }
        @media(max-width: 480px){ #card { border-radius: 0; } }
        .hdr { font-size: 13px; color: #64748b; font-weight: 700; flex-shrink: 0; }
        .screen { flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; width: 100%; height: 100%; min-height: 0; gap: 8px; }
        .title { font-size: 20px; font-weight: 800; color: #0f172a; }
        .desc { font-size: 13px; color: #334155; line-height: 1.4; background: #f8fafc; padding: 12px; border-radius: 10px; border: 2px dashed #cbd5e1; width: 100%; }
        .badge { background: #fee2e2; color: #ef4444; font-weight: 800; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .timer { font-size: 20px; font-weight: 900; color: #ef4444; background: #fef2f2; padding: 6px; border-radius: 10px; border: 2px solid #fca5a5; width: 100%; flex-shrink: 0; }
        .stage { width: 100%; flex: 1; min-height: 0; background: #f1f5f9; border-radius: 12px; position: relative; display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 2px solid #e2e8f0; overflow: hidden; }
        .room { width: 100%; flex: 1.2; position: relative; border-bottom: 2px dashed #cbd5e1; display: flex; justify-content: space-around; align-items: center; }
        .trash { position: absolute; top: 2px; left: 2px; width: 48px; height: 48px; background: #fee2e2; border: 2px solid #fca5a5; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; z-index: 5; font-weight: 800; color: #ef4444; font-size: 9px; }
        .spot { width: 52px; height: 52px; border: 2px dashed #94a3b8; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 28px; background: rgba(255,255,255,.6); }
        .inv { width: 100%; flex: 0.8; background: #e2e8f0; border-radius: 10px; display: flex; justify-content: space-around; align-items: center; position: relative; padding: 2px; }
        .item { font-size: 32px; position: absolute; z-index: 30; width: 52px; height: 52px; display: flex; justify-content: center; align-items: center; cursor: grab; }
        .desk-grid { width: 100%; height: 100%; display: flex; justify-content: space-around; align-items: center; }
        .desk { width: 64px; height: 80px; background: #fff; border: 2px solid #cbd5e1; border-radius: 10px; display: flex; justify-content: center; align-items: center; position: relative; font-size: 24px; }
        .stain { width: 30px; height: 30px; background: #78350f; border-radius: 50%; position: absolute; display: flex; justify-content: center; align-items: center; }
        .stain::after { content: '☕'; font-size: 13px; }
        .btn { background: #4f46e5; color: #fff; font-size: 15px; font-weight: 800; border: none; padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; flex-shrink: 0; }
        .btn:active { background: #4338ca; }
        .modal { position: absolute; inset: 0; background: rgba(15,23,42,.85); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal-card { background: #fff; width: 100%; padding: 20px; border-radius: 16px; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div id="card">
    <div class="hdr">🏢 회천청소년문화의집 번개 미션</div>

    <div id="sc-story" class="screen">
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
            <div class="badge">🚨 긴급 상황!</div>
            <div class="title">관장님 오기 전에<br>방을 정리해라!</div>
        </div>
        <div class="desc">관장님이 문화의집 시설 점검을 오십니다! 😱<br><br>낡은 시설을 교체하고 깨끗하게 청소해 인정받으세요!</div>
        <button class="btn" onclick="startG1()">🔥 미션 시작하기!</button>
    </div>

    <div id="sc-game" class="screen hidden">
        <div id="timer" class="timer">⏰ 10.0초</div>
        <div class="stage" id="stage">
            <div class="trash" id="trash">🗑️<span>버리는곳</span></div>
            <div class="room" id="room"></div>
            <div class="inv" id="inv"></div>
        </div>
    </div>

    <div id="sc-res" class="screen hidden">
        <div id="r-icon" style="font-size:56px; margin-top:10px;"></div>
        <div id="r-title" class="title"></div>
        <div id="r-desc" class="desc"></div>
        <div style="width:100%; display:flex; flex-direction:column; gap:6px;">
            <a id="btn-web" href="https://hcyouth.kr/" target="_blank" class="btn hidden" style="background:#0284c7; text-decoration:none;">🌐 회천청소년문화의집 방문</a>
            <button class="btn" onclick="show('sc-story')" style="background:#475569;">🔄 다시 도전하기</button>
        </div>
    </div>

    <div id="m-g1" class="modal hidden">
        <div class="modal-card">
            <h3 style="font-size:18px; margin-bottom:10px;">🎮 1단계: 의자 교체</h3>
            <p style="font-size:13px; color:#475569; margin-bottom:16px;">1️⃣ 낡은 의자(회색)를 <strong>쓰레기통🗑️</strong>으로 버리세요!<br>2️⃣ 새 의자🪑를 <strong>점선 위치</strong>로 옮기세요!</p>
            <button class="btn" onclick="countDown()">준비 완료! 👍</button>
        </div>
    </div>

    <div id="m-g2" class="modal hidden">
        <div class="modal-card">
            <h3 style="font-size:18px; margin-bottom:10px;">🧼 2단계: 책상 얼룩 닦기</h3>
            <p style="font-size:13px; color:#475569; margin-bottom:16px;">⏱️ 제한시간: <strong>20초</strong><br>🧽 <strong>물티슈</strong>를 얼룩 위에 <strong>3초 동안</strong> 대고 닦으세요!</p>
            <button class="btn" onclick="countDown()">시작하기! 🧽</button>
        </div>
    </div>

    <div id="m-cnt" class="modal hidden"><div id="c-num" style="font-size:72px; font-weight:900; color:#fff;">3</div></div>
</div>

<script>
    let curStage = 1, timeLeft = 100, timer = null, active = false;
    let cleared = 0, placed = 0, cleaned = 0;

    const $ = id => document.getElementById(id);
    const getPos = e => e.touches ? e.touches[0] : e;
    const show = id => { ['sc-story','sc-game','sc-res'].forEach(s => $(s).classList.add('hidden')); $(id).classList.remove('hidden'); };

    function startG1() { curStage = 1; show('sc-game'); init1(); $('m-g1').classList.remove('hidden'); }
    function startG2() { curStage = 2; show('sc-game'); init2(); $('m-g2').classList.remove('hidden'); }

    function countDown() {
        $('m-g1').classList.add('hidden'); $('m-g2').classList.add('hidden'); $('m-cnt').classList.remove('hidden');
        let c = 3; $('c-num').innerText = c;
        const itv = setInterval(() => {
            c--;
            if (c > 0) $('c-num').innerText = c;
            else if (c === 0) $('c-num').innerText = "GO!";
            else { clearInterval(itv); $('m-cnt').classList.add('hidden'); startTimer(); }
        }, 700);
    }

    function startTimer() {
        active = true; timeLeft = (curStage === 1) ? 100 : 200;
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            if (--timeLeft <= 0) { timeLeft = 0; gameOver(false); }
            $('timer').innerText = `⏰ ${(timeLeft / 10).toFixed(1)}초`;
        }, 100);
    }

    function init1() {
        active = false; cleared = placed = 0; $('trash').style.display = 'flex';
        $('room').innerHTML = '<div class="spot" id="s0"></div><div class="spot" id="s1"></div><div class="spot" id="s2"></div>';
        $('inv').innerHTML = ''; document.querySelectorAll('.item').forEach(e => e.remove());

        setTimeout(() => {
            const stR = $('stage').getBoundingClientRect();
            [0, 1, 2].forEach(i => {
                const sp = $('s' + i), r = sp.getBoundingClientRect();
                const oldI = createItem('🪑', r.left - stR.left + (r.width - 52)/2, r.top - stR.top + (r.height - 52)/2);
                oldI.style.filter = 'grayscale(1)';
                bindDrag(oldI, () => { if (overlap(oldI, $('trash'))) { oldI.remove(); cleared++; check1(); } });

                const slot = document.createElement('div'); slot.style.cssText = 'width:52px;height:52px;position:relative;';
                $('inv').appendChild(slot);
                const sR = slot.getBoundingClientRect();
                const newI = createItem('🪑', sR.left - stR.left, sR.top - stR.top);
                bindDrag(newI, () => { if (overlap(newI, sp) && !sp.innerText) { sp.innerText = '🪑'; newI.remove(); placed++; check1(); } });
            });
        }, 40);
    }

    function check1() { if (cleared === 3 && placed === 3) { clearInterval(timer); startG2(); } }

    function init2() {
        active = false; cleaned = 0; $('trash').style.display = 'none';
        $('room').innerHTML = `<div class="desk-grid">${[0,1,2].map(i => `<div class="desk">🪵<div class="stain" id="t${i}"></div></div>`).join('')}</div>`;
        $('inv').innerHTML = ''; document.querySelectorAll('.item').forEach(e => e.remove());

        setTimeout(() => {
            const stR = $('stage').getBoundingClientRect();
            const slot = document.createElement('div'); slot.style.cssText = 'width:52px;height:52px;position:relative;';
            $('inv').appendChild(slot);
            const sR = slot.getBoundingClientRect();
            const wiper = createItem('🧽', sR.left - stR.left, sR.top - stR.top);

            let wTimer = null, curIdx = -1;
            bindDrag(wiper, () => { clearInterval(wTimer); curIdx = -1; }, (p) => {
                let found = -1;
                [0,1,2].forEach(i => { const s = $('t'+i); if (s && s.style.display !== 'none' && overlap(wiper, s)) found = i; });
                if (found !== curIdx) {
                    clearInterval(wTimer); curIdx = found;
                    if (curIdx !== -1) {
                        let prog = 0;
                        wTimer = setInterval(() => {
                            if (++prog >= 30) { clearInterval(wTimer); $('t'+curIdx).style.display = 'none'; if (++cleaned === 3) gameOver(true); }
                        }, 100);
                    }
                }
            });
        }, 40);
    }

    function createItem(txt, left, top) {
        const el = document.createElement('div'); el.className = 'item'; el.innerText = txt;
        el.style.left = left + 'px'; el.style.top = top + 'px';
        $('stage').appendChild(el); return el;
    }

    function bindDrag(el, onEnd, onMove) {
        const start = e => {
            if (!active) return;
            const p = getPos(e), sX = p.clientX, sY = p.clientY, cL = parseFloat(el.style.left), cT = parseFloat(el.style.top);
            const move = e => {
                if (e.preventDefault) e.preventDefault();
                const cp = getPos(e); el.style.left = (cL + cp.clientX - sX) + 'px'; el.style.top = (cT + cp.clientY - sY) + 'px';
                if (onMove) onMove(cp);
            };
            const end = e => {
                window.removeEventListener('mousemove', move); window.removeEventListener('touchmove', move);
                window.removeEventListener('mouseup', end); window.removeEventListener('touchend', end);
                if (onEnd) onEnd(getPos(e));
            };
            window.addEventListener('mousemove', move, {passive:false}); window.addEventListener('touchmove', move, {passive:false});
            window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
        };
        el.addEventListener('mousedown', start); el.addEventListener('touchstart', start, {passive:false});
    }

    function overlap(a, b) {
        const r1 = a.getBoundingClientRect(), r2 = b.getBoundingClientRect();
        return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    function gameOver(win) {
        active = false; clearInterval(timer); show('sc-res');
        if (win) {
            $('r-icon').innerText = '👩‍💼✨'; $('r-title').innerText = '미션 성공!'; $('r-title').style.color = '#10b981';
            $('r-desc').innerHTML = '<strong>시설 교체부터 청소까지 완벽 완료!</strong><br><br>관장님: "문화의집을 깨끗하게 가꿔줘서 고마워요!"';
            $('btn-web').classList.remove('hidden');
        } else {
            $('r-icon').innerText = '👩‍💼💢'; $('r-title').innerText = '미션 실패!'; $('r-title').style.color = '#ef4444';
            $('r-desc').innerHTML = curStage === 1 ? '<strong>시간 초과! 의자를 못 바꿨습니다...</strong>' : '<strong>시간 초과! 얼룩을 다 못 닦았습니다...</strong>';
            $('btn-web').classList.add('hidden');
        }
    }
</script>
</body>
</html>
