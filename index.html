<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>회천청소년문화의집 미션</title>
<style>
  *{box-sizing:border-box;user-select:none;touch-action:none}
  body{margin:0;background:#0f172a;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
  #g{background:#fff;width:100%;max-width:400px;height:100vh;max-height:700px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;position:relative}
  .h{display:none!important}.btn{background:#4f46e5;color:#fff;font-size:18px;font-weight:800;border:none;padding:12px;border-radius:12px;width:100%;cursor:pointer}
  .stage{flex:1;background:#f1f5f9;border-radius:12px;position:relative;margin:10px 0;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
  .area{height:55%;position:relative;display:flex;justify-content:space-around;align-items:center;border-bottom:2px dashed #cbd5e1}
  .inv{height:35%;background:#e2e8f0;border-radius:8px;display:flex;justify-content:space-around;align-items:center;position:relative}
  .trash{position:absolute;top:5px;left:5px;width:50px;height:50px;background:#fee2e2;border:2px solid #fca5a5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .spot{width:50px;height:50px;border:2px dashed #94a3b8;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .item{font-size:35px;position:absolute;z-index:20;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:grab}
  .desk{width:70px;height:90px;background:#e2e8f0;border:2px solid #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}
  .stain{width:30px;height:30px;background:#78350f;border-radius:50%;position:absolute;display:flex;align-items:center;justify-content:center}
  .stain::after{content:'☕';font-size:14px}
  .pop{position:absolute;inset:0;background:#0f172ad9;z-index:100;display:flex;justify-content:center;align-items:center;padding:20px}
  .card{background:#fff;padding:20px;border-radius:16px;width:100%}
</style>
</head>
<body>
<div id="g">
  <h3>🏢 회천청소년문화의집 번개 미션</h3>
  
  <div id="s-story">
    <h2>🚨 관장님 오기 전 해결하라!</h2>
    <p>어지러진 방을 정리해 인정을 받으세요!</p>
    <button class="btn" onclick="ready1()">🔥 미션 시작!</button>
  </div>

  <div id="s-game" class="h">
    <h2 id="tm" style="color:#ef4444;margin:5px 0">⏰ 10.0초</h2>
    <div class="stage" id="stage">
      <div class="trash" id="trash">🗑️</div>
      <div class="area" id="room"></div>
      <div class="inv" id="inv"></div>
    </div>
  </div>

  <div id="s-result" class="h">
    <h1 id="r-ico"></h1><h2 id="r-tt"></h2><p id="r-desc"></p>
    <a id="btn-web" href="https://hcyouth.kr/" target="_blank" class="btn h" style="background:#0284c7;text-decoration:none;display:block;margin-bottom:8px">🌐 공식 웹사이트 방문</a>
    <button class="btn" onclick="show('s-story')" style="background:#475569">🔄 다시 하기</button>
  </div>

  <div id="pop-g1" class="pop h"><div class="card"><h3>🎮 1단계: 의자 교체</h3><p>헌 의자 🗑️에 버리고 새 의자 🪑 놓기!</p><button class="btn" onclick="startCount()">OK!</button></div></div>
  <div id="pop-g2" class="pop h"><div class="card"><h3>🧼 2단계: 얼룩 닦기</h3><p>🧽 물티슈를 얼룩 위에 3초 대고 계세요!</p><button class="btn" onclick="startCount()">시작!</button></div></div>
  <div id="pop-cnt" class="pop h"><h1 id="cnt" style="color:#fff;font-size:80px">3</h1></div>
</div>

<script>
let curStage=1, time=100, timer=null, playing=false, oldC=0, newP=0, cleanC=0;
const $=id=>document.getElementById(id), getP=e=>e.touches?e.touches[0]:e;

function show(s){['s-story','s-game','s-result'].forEach(i=>$(i).classList.add('h'));$(s).classList.remove('h');}
function ready1(){curStage=1;show('s-game');init1();$('pop-g1').classList.remove('h');}
function ready2(){curStage=2;show('s-game');init2();$('pop-g2').classList.remove('h');}

function startCount(){
  $('pop-g1').classList.add('h');$('pop-g2').classList.add('h');$('pop-cnt').classList.remove('h');
  let c=3;$('cnt').innerText=c;
  let t=setInterval(()=>{
    c--;if(c>0)$('cnt').innerText=c;
    else if(c===0)$('cnt').innerText="GO!";
    else{clearInterval(t);$('pop-cnt').classList.add('h');startTimer();}
  },800);
}

function startTimer(){
  playing=true;time=(curStage===1)?100:200;
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
    if(--time<=0){time=0;endGame(false);}
    $('tm').innerText=`⏰ ${(time/10).toFixed(1)}초`;
  },100);
}

function init1(){
  playing=false;oldC=newP=0;$('trash').style.display='flex';
  const rm=$('room'), inv=$('inv'), st=$('stage');
  rm.innerHTML='<div class="spot" id="p0"></div><div class="spot" id="p1"></div><div class="spot" id="p2"></div>';
  inv.innerHTML='';document.querySelectorAll('.item').forEach(e=>e.remove());
  
  [0,1,2].forEach(i=>{
    let sp=$('p'+i), r=sp.getBoundingClientRect(), sr=st.getBoundingClientRect();
    let o=document.createElement('div');o.className='item';o.innerText='🪑';o.style.filter='grayscale(1)';
    o.style.left=(r.left-sr.left)+'px';o.style.top=(r.top-sr.top)+'px';
    st.appendChild(o);drag(o,p=>{
      if(hit(o,$('trash'))){o.remove();oldC++;check1();}
    });
    let n=document.createElement('div');n.className='item';n.innerText='🪑';n.style.position='relative';
    inv.appendChild(n);drag(n,p=>{
      if(hit(n,sp)&&!sp.innerText){sp.innerText='🪑';n.remove();newP++;check1();}
    });
  });
}

function init2(){
  playing=false;cleanC=0;$('trash').style.display='none';$('room').innerHTML='<div class="desk">🪵<div class="stain" id="t0"></div></div><div class="desk">🪵<div class="stain" id="t1"></div></div><div class="desk">🪵<div class="stain" id="t2"></div></div>';
  $('inv').innerHTML='';document.querySelectorAll('.item').forEach(e=>e.remove());
  
  let w=document.createElement('div');w.className='item';w.innerText='🧽';w.style.position='relative';
  $('inv').appendChild(w);
  let wt=null,wi=-1;
  drag(w,p=>{
    clearInterval(wt);wi=-1;
  },p=>{
    let h=-1;
    [0,1,2].forEach(i=>{if($('t'+i)&&$('t'+i).style.display!='none'&&hit(w,$('t'+i)))h=i;});
    if(h!==wi){
      clearInterval(wt);wi=h;
      if(wi!==-1){
        let prog=0;
        wt=setInterval(()=>{
          if(++prog>=30){clearInterval(wt);$('t'+wi).style.display='none';cleanC++;if(cleanC===3)endGame(true);}
        },100);
      }
    }
  });
}

function drag(el,onEnd,onMove){
  let sx,sy,lx,ly;
  const s=e=>{
    if(!playing)return;
    let p=getP(e);sx=p.clientX;sy=p.clientY;lx=parseFloat(el.style.left)||0;ly=parseFloat(el.style.top)||0;
    const m=e=>{let p=getP(e);el.style.left=(lx+p.clientX-sx)+'px';el.style.top=(ly+p.clientY-sy)+'px';if(onMove)onMove(p);};
    const u=e=>{window.removeEventListener('touchmove',m);window.removeEventListener('touchend',u);window.removeEventListener('mousemove',m);window.removeEventListener('mouseup',u);if(onEnd)onEnd(getP(e));};
    window.addEventListener('touchmove',m);window.addEventListener('touchend',u);window.addEventListener('mousemove',m);window.addEventListener('mouseup',u);
  };
  el.addEventListener('touchstart',s);el.addEventListener('mousedown',s);
}

function hit(a,b){
  let r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();
  return !(r1.right<r2.left||r1.left>r2.right||r1.bottom<r2.top||r1.top>r2.bottom);
}

function check1(){if(oldC===3&&newP===3){clearInterval(timer);ready2();}}

function endGame(w){
  playing=false;clearInterval(timer);show('s-result');
  $('r-ico').innerText=w?'👩‍💼✨':'👩‍💼💢';
  $('r-tt').innerText=w?'모든 미션 클리어!':'미션 실패!';
  $('r-desc').innerText=w?'관장님: "문화의집 정리를 아주 잘해줬네요!"':'시간이 초과되었습니다...';
  if(w)$('btn-web').classList.remove('h');else$('btn-web').classList.add('h');
}
</script>
</body>
</html>
